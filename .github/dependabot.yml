version: 2
updates:
  # react/react-dom zijn gepind (vendored naar dist/), esbuild is build-tooling.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly

  # De CLA-action draait op pull_request_target mét schrijfrechten en staat
  # daarom op een commit-SHA gepind in plaats van een verplaatsbare tag. Die pin
  # krijgt nooit vanzelf een securityfix — Dependabot bumpt hem hier in een PR.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
