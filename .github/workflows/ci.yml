name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: node tests/engine-smoke.mjs
      - run: npm run build
      - name: dist mag geen dev/CDN-referenties bevatten
        run: "! grep -r 'unpkg\\|text/babel' dist/"
